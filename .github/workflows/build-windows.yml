name: Sovela Windows · tested private build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install reproducible packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'pyinstaller==6.22.3' 'pyinstaller-hooks-contrib==2026.9'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tools failed to install.' }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed.' }
          }

      - name: Verify source and current feature regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
          foreach ($file in @('test_sovela_v31.py', 'test_sovela_v311_fix.py', 'test_sovela_v312_fix.py', 'test_sovela_release_sanity.py')) {
            python -m unittest discover -s tests -p $file -v
            if ($LASTEXITCODE -ne 0) { throw "Feature test failure: $file" }
          }

      - name: Inject only public application configuration
        shell: pwsh
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SOVELA_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.SOVELA_SUPABASE_PUBLISHABLE_KEY }}
          SOVELA_UPDATES_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PUBLIC_SUPABASE_URL -or -not $env:PUBLIC_SUPABASE_KEY) {
            throw 'Missing public Supabase repository variables.'
          }
          if ($env:PUBLIC_SUPABASE_KEY -match '^(sk_|sb_secret_|service_role)') {
            throw 'A private key was supplied to a public desktop application. Build stopped.'
          }
          $settings = Get-Content sovela_cloud.json -Raw | ConvertFrom-Json
          $settings.supabase_url = $env:PUBLIC_SUPABASE_URL
          $settings.supabase_publishable_key = $env:PUBLIC_SUPABASE_KEY
          $settings.updates_repo = $env:SOVELA_UPDATES_REPO
          $settings | ConvertTo-Json | Set-Content sovela_cloud.json -Encoding utf8

      - name: Build desktop program and ONE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --windowed --onedir --name Sovela --icon sovela.ico --add-data 'sovela.png;.' main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed.' }
          Copy-Item sovela_config.json dist/Sovela/sovela_config.json
          Copy-Item sovela_cloud.json dist/Sovela/sovela_cloud.json
          Copy-Item PRIVACY.txt dist/Sovela/PRIVACY.txt
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'SovelaInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $files = @(Get-ChildItem 'installer-output/SovelaSetup-v*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one installer, found $($files.Count)." }
          $files[0].FullName | Set-Content 'installer-path.txt'
          $expected = python -c "from sovela_auth import VERSION; print('SovelaSetup-v' + VERSION + '.exe')"
          if ($files[0].Name -ne $expected.Trim()) { throw 'Installer version does not match app version.' }

      - name: Scan release with Microsoft Defender (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-Content 'installer-path.txt' -Raw).Trim()
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Defender was unavailable on the build runner. Release cannot be approved.'
          }
          $start = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path 'dist/Sovela').Path -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath $installer -ErrorAction Stop
          if (-not (Test-Path $installer)) { throw 'Installer missing after Defender scan.' }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $start.AddMinutes(-1)
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List ThreatID,InitialDetectionTime,Resources | Out-String | Write-Host
            throw 'A Defender detection occurred during this build. Installer NOT approved.'
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -FilePath $installer
          @(
            "Sovela private QA build",
            "Commit: $env:GITHUB_SHA",
            "Installer: $(Split-Path $installer -Leaf)",
            "SHA256: $hash",
            "Defender signature version: $($status.AntivirusSignatureVersion)",
            "Defender: no detection in this scan (not a complete security audit)",
            "Windows Authenticode: $($signature.Status)",
            "Chrome Safe Browsing approval: NOT VERIFIED",
            "Real Windows functionality and Supabase/Stripe integration: NOT VERIFIED",
            "Do not release publicly based on this scan alone."
          ) | Set-Content 'SOVELA_QA_REPORT.txt' -Encoding utf8
          "$hash *$(Split-Path $installer -Leaf)" | Set-Content 'installer-output/SHA256SUMS.txt' -Encoding ascii

      - name: Upload PRIVATE checked installer + audit report
        uses: actions/upload-artifact@v4
        with:
          name: Sovela-v3.1.2-Private-QA
          if-no-files-found: error
          retention-days: 7
          path: |
            installer-output/SovelaSetup-v*.exe
            installer-output/SHA256SUMS.txt
            SOVELA_QA_REPORT.txt

# This workflow deliberately NEVER auto-publishes a GitHub Release.
# A private build may still be blocked by Chrome. Do not bypass the warning.
# Public distribution requires reviewing any detection, real Windows tests,
# payment security checks, and ideally trusted publisher code signing.
