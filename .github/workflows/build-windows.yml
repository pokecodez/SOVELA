name: SOVELA RECOVERY 312 - CLEAN BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: RECOVERY WORKFLOW ACTIVE - download Sovela code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: RECOVERY CHECK - application integrity (no external test folder)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import ast, json
          from sovela_auth import VERSION, read_cloud_config
          from sovela_v3_core import load_local_settings, premium_allowed
          from sovela_preferences import validated
          from sovela_v31 import SovelaV31
          from tempfile import TemporaryDirectory

          root=Path('.')
          for name in ('main.py','sovela_launcher.py','sovela_v31.py','sovela_auth.py',
                       'sovela_v3_core.py','sovela_scans.py','sovela_care.py',
                       'sovela_window.py','sovela_dialogs.py','SovelaInstaller.iss',
                       'sovela.ico','sovela.png','sovela_cloud.json'):
              assert (root/name).is_file(), 'Required source missing: '+name
          files=list(root.glob('*.py'))
          for f in files: ast.parse(f.read_text(encoding='utf-8'),filename=str(f))
          assert VERSION=='3.1.2', 'Files are from different Sovela versions'
          installer=(root/'SovelaInstaller.iss').read_text(encoding='utf-8')
          assert '#define MyAppVersion "'+VERSION+'"' in installer, 'Installer version mismatch'
          with TemporaryDirectory() as d:
              prefs=Path(d)/'settings.json'
              prefs.write_text('{"premium_clean_preview":true,"premium_weekly_defender":true}', encoding='utf-8')
              obj=load_local_settings(prefs)
              assert not obj['premium_weekly_clean_enabled'], 'Legacy settings must not enable deletion'
              assert not obj['premium_clean_categories']
          assert premium_allowed({'tier':'trial'})
          assert premium_allowed({'tier':'premium'})
          assert not premium_allowed({'tier':'free'})
          assert validated({'safe_window_frame':True})['safe_window_frame']
          app=(root/'sovela_v31.py').read_text(encoding='utf-8')
          for name in ('Owner Studio','Test Stripe Sandbox checkout', 'Begin scan',
                       'Enable weekly cleanup', 'premium_weekly_clean_enabled',
                       'WEEKLY ANTIVIRUS REMINDER', 'Credits', 'account_sheet',
                       'Re-check owner permissions'):
              assert name in app, 'Missing feature '+name
          assert '_premium_maintenance' in app and '_scan_permission_toast' in app
          # Check that no private backend credentials are in the bundled JSON.
          public=json.loads((root/'sovela_cloud.json').read_text(encoding='utf-8-sig'))
          assert 'service_role' not in public and 'stripe_secret' not in public
          print('RECOVERY 312 VERIFIED: required Python source, owner panel, accounts, weekly consent, scan reminders, payments and installer version')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Sovela source check failed. Review the message above.' }

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PyInstaller.' }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }

      - name: Include only PUBLIC Supabase settings
        shell: pwsh
        env:
          PUBLIC_URL: ${{ vars.SOVELA_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.SOVELA_SUPABASE_PUBLISHABLE_KEY }}
          UPDATES_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_URL) -or [string]::IsNullOrWhiteSpace($env:PUBLIC_KEY)) {
            throw 'SOVELA_SUPABASE_URL and SOVELA_SUPABASE_PUBLISHABLE_KEY GitHub variables are required.'
          }
          if ($env:PUBLIC_KEY -match '^(sk_|sb_secret_|service_role)') {
            throw 'Private backend key detected: do not embed it in Sovela.exe.'
          }
          $cloud=Get-Content 'sovela_cloud.json' -Raw | ConvertFrom-Json
          $cloud.supabase_url=$env:PUBLIC_URL
          $cloud.supabase_publishable_key=$env:PUBLIC_KEY
          $cloud.updates_repo=$env:UPDATES_REPO
          $cloud | ConvertTo-Json -Depth 3 | Set-Content 'sovela_cloud.json' -Encoding utf8

      - name: Build the original Sovela program
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name Sovela --icon sovela.ico --add-data 'sovela.png;.' main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed to build Sovela.exe.' }
          foreach ($file in @('sovela_config.json','sovela_cloud.json','PRIVACY.txt')) {
            Copy-Item $file 'dist/Sovela/' -ErrorAction Stop
          }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'SovelaInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $version=(python -c 'from sovela_auth import VERSION;print(VERSION)').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not check installer version.' }
          $installer="installer-output/SovelaSetup-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer not found: $installer" }
          $files=@(Get-ChildItem 'installer-output/SovelaSetup-v*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected ONE installer, got $($files.Count)" }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SovelaSetup-v$version.exe" | Set-Content 'installer-output/SHA256SUMS.txt' -Encoding ascii
          $sig=Get-AuthenticodeSignature -FilePath $installer
          @(
            'Sovela private developer build',
            "Commit: $env:GITHUB_SHA",
            "Installer: SovelaSetup-v$version.exe",
            "SHA256: $hash",
            "Windows signature: $($sig.Status)",
            'This build has NOT been certified as malware-free.',
            'Chrome Safe Browsing acceptance has NOT been verified.',
            'Premium backend and Windows behaviour require live testing.',
            'Do not publish to customers until security review and code signing.'
          ) | Set-Content 'INSTALLER_SECURITY_REPORT.txt' -Encoding utf8
          Write-Host 'SUCCESS: installer compiled and checksum recorded.'

      - name: Check Windows Defender results where available
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(python -c 'from sovela_auth import VERSION;print(VERSION)').Trim()
          $installer="installer-output/SovelaSetup-v$version.exe"
          $report='INSTALLER_SECURITY_REPORT.txt'
          try {
            $status=Get-MpComputerStatus -ErrorAction Stop
          } catch {
            Add-Content $report 'Microsoft Defender scan: UNAVAILABLE on build runner (NOT VERIFIED)'
            Write-Warning 'Defender not available; this is an unverified private installer.'
            $status=$null
          }
          if ($null -ne $status) {
            if (-not $status.AntivirusEnabled -or -not $status.AMServiceEnabled) {
              Add-Content $report 'Microsoft Defender scan: DISABLED on build runner (NOT VERIFIED)'
              Write-Warning 'Defender disabled on build runner; this is an unverified private installer.'
            } else {
              $started=Get-Date
              try {
                Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path 'dist/Sovela').Path -ErrorAction Stop
                Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer).Path -ErrorAction Stop
                $hits=@(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.InitialDetectionTime -ge $started.AddMinutes(-1) })
                if ($hits.Count -gt 0) {
                  $hits | Format-List ThreatID,Resources | Out-String | Write-Host
                  throw 'MICROSOFT DEFENDER DETECTED A THREAT. No artifact will be uploaded.'
                }
                Add-Content $report "Microsoft Defender: no detections reported by this scan (signatures $($status.AntivirusSignatureVersion)). This is NOT a security certification."
              } catch {
                if ($_.Exception.Message -match 'DETECTED A THREAT') { throw }
                Add-Content $report 'Microsoft Defender: SCAN FAILED on build runner (NOT VERIFIED)'
                Write-Warning 'Defender scan could not complete. Binary is UNVERIFIED; do not install when browser blocks it.'
              }
            }
          }

      - name: Upload one PRIVATE installer and report
        uses: actions/upload-artifact@v4
        with:
          name: Sovela-RESTORED-v3.1.2-Private
          if-no-files-found: error
          retention-days: 7
          path: |
            installer-output/SovelaSetup-v3.1.2.exe
            installer-output/SHA256SUMS.txt
            INSTALLER_SECURITY_REPORT.txt

# Deliberately NO tag publishing and NO automated release.
# Chrome may still block an unsigned binary; do not bypass security warnings.
